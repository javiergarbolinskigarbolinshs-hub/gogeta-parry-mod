name: Mod bauen & veroeffentlichen

# Baut die Mod automatisch auf GitHub und stellt die .jar unter "Releases" zum Download bereit.
# Neue Version veroeffentlichen: mod_version in gradle.properties erhoehen und hochladen.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Quellcode entpacken (nur beim ersten Hochladen)
        run: |
          if [ -f quellcode.zip ]; then
            unzip -o quellcode.zip -d .
            git rm -q quellcode.zip
            git add -A
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Quellcode der Gogeta Parry Mod entpackt"
            git push
          fi

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Mod bauen
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Version lesen
        id: ver
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Jar als Artifact speichern
        uses: actions/upload-artifact@v4
        with:
          name: gogetaparry-${{ steps.ver.outputs.version }}
          path: build/libs/gogetaparry-1.20.1-*.jar

      - name: Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Gogeta Parry ${{ steps.ver.outputs.version }} (Minecraft 1.20.1 Forge)
          make_latest: true
          files: build/libs/gogetaparry-1.20.1-*.jar
          body: |
            ## ⬇ Download
            Unten bei **Assets** die Datei **`gogetaparry-1.20.1-${{ steps.ver.outputs.version }}.jar`** anklicken.

            ## Installieren
            1. **Minecraft Forge 1.20.1** installieren (z. B. im CurseForge-Launcher ein Profil „1.20.1 Forge“ anlegen).
            2. Die `.jar` in den Ordner **`mods`** legen (CurseForge: Profil → ⋯ → „Open Folder“ → `mods`).
            3. Empfohlen: **Curios API (Forge 1.20.1)** dazu – dann kommt das Amulett in den Halsketten-Slot.
            4. Spiel starten, Ki-Kristall in Truhen finden, Fusions-Amulett craften – fertig!

            ⚠ Die `.jar` gehört in den `mods`-Ordner – **nicht** die Zip-Datei „Source code“.

            © 2026 Havi Gamer · Fan-Mod, inspiriert von Dragon Ball Legends (nicht offiziell)
